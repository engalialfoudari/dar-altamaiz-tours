kind = "mobile"
previewPath = "/"
title = "Dar AlTamaiz Tours"
version = "1.0.0"
id = "artifacts/dar-altamaiz-tours"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25141

[services.development]
run = "pnpm --filter @workspace/dar-altamaiz-tours run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dar-altamaiz-tours", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dar-altamaiz-tours", "run", "serve" ]

[services.env]
PORT = "25141"
BASE_PATH = "/"
