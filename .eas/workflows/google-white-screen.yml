name: Android Google callback recovery
on:
  workflow_dispatch: {}
defaults:
  image: sdk-54
  tools:
    node: "22.14.0"
jobs:
  production:
    type: update
    environment: production
    env:
      EXPO_PUBLIC_API_BASE: https://dt-tour.com/api
      EXPO_PUBLIC_DOMAIN: dt-tour.com
    params:
      platform: android
      channel: production
      message: "Android Google sign-in callback: prevent unsupported browser dismissal, single completion owner, verified named welcome; retain package ordering and runtime 1.0.6"
