name: Build Android Play Store AAB
on:
  workflow_dispatch: {}
jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production
    hooks:
      before_install_node_modules:
        - name: Provide Android Google services configuration
          run: test -f "$GOOGLE_SERVICES_JSON" && cp "$GOOGLE_SERVICES_JSON" ./google-services.json
