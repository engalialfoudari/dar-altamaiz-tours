name: Android Google return diagnostics
on:
  workflow_dispatch: {}
defaults:
  image: sdk-54
  tools:
    node: "22.14.0"
jobs:
  production:
    type: update
    environment: production
    env:
      EXPO_PUBLIC_API_BASE: https://dt-tour.com/api
      EXPO_PUBLIC_DOMAIN: dt-tour.com
    params:
      platform: android
      channel: production
      message: "Android-only privacy-safe Google browser return diagnostics; runtime 1.0.6; no authentication behavior change"
